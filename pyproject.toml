[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supportflow"
version = "0.1.0"
description = "A learning-oriented Python support agent with real tools, approvals and evaluation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "langchain-openai>=1,<2",
  "langchain-community>=0.4,<1",
  "langchain-text-splitters>=1,<2",
  "langchain-chroma>=1,<2",
  "pypdf>=5,<8",
  "pydantic-settings>=2,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["supportflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["runtime", ".buildtmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
